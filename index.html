<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; }
  #root { min-height: 100vh; min-height: 100dvh; }
  #rlv-loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F3E9D4; color: #6B4A2E; z-index: 9999; gap: 14px;
  }
  #rlv-loading .rlv-loading-mark {
    font-family: Georgia, 'Times New Roman', serif; letter-spacing: .18em; text-transform: uppercase;
    font-size: 15px; font-weight: 600; color: #82501F; display: flex; gap: 2px;
  }
  #rlv-loading .rlv-loading-mark span { display: inline-block; animation: rlvLetterFade 1.4s ease-in-out infinite; opacity: .25; }
  #rlv-loading .rlv-loading-mark span:nth-child(1) { animation-delay: 0s; }
  #rlv-loading .rlv-loading-mark span:nth-child(2) { animation-delay: .07s; }
  #rlv-loading .rlv-loading-mark span:nth-child(3) { animation-delay: .14s; }
  #rlv-loading .rlv-loading-mark span:nth-child(4) { animation-delay: .21s; }
  #rlv-loading .rlv-loading-mark span:nth-child(5) { animation-delay: .28s; }
  #rlv-loading .rlv-loading-mark span:nth-child(6) { animation-delay: .35s; }
  #rlv-loading .rlv-loading-mark span:nth-child(8) { animation-delay: .42s; }
  #rlv-loading .rlv-loading-mark span:nth-child(9) { animation-delay: .49s; }
  #rlv-loading .rlv-loading-mark span:nth-child(10) { animation-delay: .56s; }
  #rlv-loading .rlv-loading-mark span:nth-child(11) { animation-delay: .63s; }
  #rlv-loading .rlv-loading-mark span:nth-child(12) { animation-delay: .70s; }
  #rlv-loading .rlv-loading-mark span:nth-child(13) { animation-delay: .77s; }
  #rlv-loading .rlv-loading-mark span:nth-child(14) { animation-delay: .84s; }
  #rlv-loading .rlv-loading-bar { width: 120px; height: 2px; background: #C9AD7C; border-radius: 2px; overflow: hidden; position: relative; }
  #rlv-loading .rlv-loading-bar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px;
    background: #82501F; animation: rlvBarSlide 1.3s ease-in-out infinite;
  }
  @keyframes rlvLetterFade { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes rlvBarSlide { 0% { left: -40%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    #rlv-loading .rlv-loading-mark span { animation: none; opacity: 1; }
    #rlv-loading .rlv-loading-bar::after { animation: none; left: 30%; }
  }
  #rlv-gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #F3E9D4; z-index: 9998; padding: 20px; }
  #rlv-gate .box { background: #E9D9B8; border: 1.5px solid #C9AD7C; border-radius: 8px; padding: 28px; max-width: 480px; width: 100%; color: #37200F; }
  #rlv-gate h1 { font-size: 18px; margin: 0 0 10px; }
  #rlv-gate p { font-size: 13px; line-height: 1.5; color: #6B4A2E; }
  #rlv-url-input { width: 100%; padding: 10px; border: 1.5px solid #C9AD7C; border-radius: 4px; font-size: 16px; margin: 10px 0; box-sizing: border-box; -webkit-appearance: none; }

    return r ? JSON.parse(r.value) : fallback;

  }

  } catch (e) {

}

function tiempoRelativo(ts) {
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return "justo ahora";
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h}h`;
  return `hace ${Math.floor(h / 24)}d`;
}

      @keyframes lbSpin { to { transform: rotate(360deg); } }
      @keyframes lbShimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
      @keyframes lbConfettiFall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(140px) rotate(360deg); opacity: 0; } }

      .lb-fade-in { animation: lbFadeUp .35s ease both; }
      .lb-pop { animation: lbPop .4s cubic-bezier(.2,.9,.3,1.2) both; }
      .lb-live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--oxblood); animation: lbPulseDot 1.4s ease infinite; }
      .lb-glow { animation: lbGlow 1.8s ease infinite; }
      .lb-spinicon { animation: lbSpin .8s linear infinite; display: inline-flex; }
      .lb-stagger > * { animation: lbFadeUp .35s ease both; }
      .lb-stagger > *:nth-child(1) { animation-delay: .02s; }
      .lb-stagger > *:nth-child(2) { animation-delay: .06s; }
      .lb-stagger > *:nth-child(3) { animation-delay: .10s; }
      .lb-stagger > *:nth-child(4) { animation-delay: .14s; }
      .lb-stagger > *:nth-child(5) { animation-delay: .18s; }
      .lb-stagger > *:nth-child(6) { animation-delay: .22s; }

      .lb-card-hover { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
      .lb-card-hover:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(55,32,15,.14); border-color: var(--oxblood); }

      .lb-nav-item { transition: background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease; }
      .lb-nav-item svg { transition: transform .2s ease; }
      .lb-nav-item:hover svg { transform: translateX(2px) scale(1.08); }
      .lb-nav-item.active svg { transform: scale(1.08); }

      .lb-progress-track { width: 100%; height: 6px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
      .lb-progress-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }

      .lb-confetti-wrap { position: relative; width: 100%; height: 0; overflow: visible; }
      .lb-confetti-piece { position: absolute; top: 0; display: inline-flex; animation: lbConfettiFall 1.6s ease-in forwards; }

      .lb-root.lb-dark {
        --paper: #241A10;
        --paper-dark: #2E2115;
        --ink: #F0E4CE;
        --ink-soft: #C6AE8A;
        --line: #4A3823;
        --oxblood: #C2723F;
        --gold: #E8C67E;
      }
      .lb-root.lb-dark .lb-input, .lb-root.lb-dark .lb-select, .lb-root.lb-dark .lb-textarea { background: #1D150D; }
      .lb-root.lb-dark .lb-btn { color: var(--paper); }
      .lb-root.lb-dark .lb-btn.ghost, .lb-root.lb-dark .lb-btn.oxblood, .lb-root.lb-dark .lb-btn.olive { color: var(--on-accent); }
      .lb-root.lb-dark .lb-btn.ghost { color: var(--ink); }

      .lb-topbar {
        display: flex; align-items: center; justify-content: flex-end; gap: 8px;
        padding: 10px 32px 0; position: relative;
      }
      .lb-icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; border-radius: 6px; border: 1.5px solid var(--line);
        background: var(--paper-dark); color: var(--ink); cursor: pointer; position: relative;
        transition: transform .12s ease, background .12s ease;
      }
      .lb-icon-btn:hover { transform: translateY(-1px); background: var(--gold); }
      .lb-badge-dot {
        position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; border-radius: 8px;
        background: var(--oxblood); color: var(--on-accent); font-size: 9px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; padding: 0 3px;
        font-family: 'IBM Plex Mono', monospace; border: 1.5px solid var(--paper);
      }

      .lb-modal-overlay {
        position: fixed; inset: 0; background: rgba(43,38,32,.45); z-index: 200;
        display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
        animation: lbFadeIn .15s ease;
      }
      .lb-palette {
        width: 560px; max-width: 92vw; background: var(--paper); border: 1.5px solid var(--line);
        border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.3); overflow: hidden; animation: lbPop .18s ease;
      }
      .lb-palette-input {
        width: 100%; border: none; border-bottom: 1.5px solid var(--line); padding: 16px 18px;
        font-size: 16px; background: transparent; color: var(--ink); font-family: 'Inter', sans-serif; outline: none;
      }
      .lb-palette-results { max-height: 340px; overflow-y: auto; }
      .lb-palette-item {
        padding: 11px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px;
        border-bottom: 1px solid var(--line);
      }
      .lb-palette-item:hover, .lb-palette-item.active { background: var(--paper-dark); }

      /* -------- Modal de producto / Lucky Box en el catálogo público (zoom + difuminado) -------- */
      @keyframes lbLetterFade { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes lbBarSlide { 0% { left: -40%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        [style*="lbLetterFade"] { animation: none !important; opacity: 1 !important; }
      }
      @keyframes lbBlurIn { from { backdrop-filter: blur(0px); background: rgba(43,38,32,0); } to { backdrop-filter: blur(6px); background: rgba(20,15,8,.55); } }
      @keyframes lbZoomIn { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      .lb-detail-overlay {
        position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow-y: auto;
        animation: lbBlurIn .28s ease forwards;
        background: rgba(20,15,8,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      .lb-detail-card {
        background: var(--paper); border-radius: 12px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto;
        animation: lbZoomIn .32s cubic-bezier(.2,.9,.25,1.1) forwards; box-shadow: 0 30px 70px rgba(0,0,0,.4);
        position: relative;
      }
      .lb-detail-close {
        position: absolute; top: 14px; right: 14px; z-index: 2;
        width: 34px; height: 34px; border-radius: 50%; background: rgba(20,15,8,.55); color: #fff;
        display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
        backdrop-filter: blur(4px);
      }

      /* -------- Landing page del catálogo -------- */
      .lb-landing-section { padding: 56px 0; }
      .lb-landing-section + .lb-landing-section { border-top: 1px solid var(--line); }
      .lb-landing-kicker {
        font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
        color: var(--oxblood); text-align: center; display: block; margin-bottom: 10px;
      }
      .lb-landing-title { font-size: clamp(26px, 4vw, 38px); text-align: center; margin: 0 0 8px; }
      .lb-landing-sub { text-align: center; color: var(--ink-soft); font-size: 14px; max-width: 480px; margin: 0 auto 40px; }
      .lb-featured-card {
        position: relative; cursor: pointer; border-radius: 4px; overflow: hidden; background: var(--paper-dark);
        border: 1px solid var(--line); transition: transform .3s ease, box-shadow .3s ease;
      }
      .lb-featured-card:hover { transform: translateY(-6px); box-shadow: 0 22px 40px rgba(43,38,32,.18); }
      .lb-featured-img-wrap { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; background: var(--paper); }
      .lb-featured-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
      .lb-featured-card:hover .lb-featured-img-wrap img { transform: scale(1.06); }

      .lb-dropdown {
        position: absolute; top: 42px; right: 0; width: 320px; background: var(--paper);
        border: 1.5px solid var(--line); border-radius: 8px; box-shadow: 0 14px 34px rgba(0,0,0,.2);
        z-index: 150; animation: lbPop .15s ease; max-height: 380px; overflow-y: auto;
      }
      .lb-dropdown-item { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
      .lb-dropdown-item:last-child { border-bottom: none; }

      .lb-checkbox {
        width: 17px; height: 17px; border: 1.5px solid var(--line); border-radius: 4px;
        background: var(--paper); cursor: pointer; flex-shrink: 0; display: inline-flex;
        align-items: center; justify-content: center; color: var(--on-accent);
      }
      .lb-checkbox.checked { background: var(--oxblood); border-color: var(--oxblood); }

      .lb-bulk-bar {
        position: sticky; bottom: 16px; margin-top: 16px; background: var(--ink); color: var(--paper);
        border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px;
        box-shadow: 0 10px 26px rgba(0,0,0,.25); animation: lbFadeUp .2s ease;
      }

      /* -------- Bento dashboard -------- */
      .lb-bento {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      }
      .lb-bento > * { min-width: 0; }
      .lb-bento-hero, .lb-bento-activity { grid-column: span 2; }
      .lb-bento-quick {
        border: none; border-radius: 10px; padding: 18px; cursor: pointer; text-align: left;
        display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 1 / 0.85;
        transition: transform .15s ease;
      }
      .lb-bento-quick:hover { transform: translateY(-3px); }
      .lb-bento-quick-icon { background: rgba(43,38,32,.08); padding: 8px; border-radius: 10px; width: fit-content; }
      @media (max-width: 980px) {
        .lb-bento { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 560px) {
        .lb-bento { grid-template-columns: 1fr; }
        .lb-bento-hero, .lb-bento-activity, .lb-bento > div[style*="span 2"] { grid-column: span 1 !important; }
      }

      @media (max-width: 880px) {
        .lb-shell { grid-template-columns: 64px 1fr !important; }
      }

      /* -------- Nav inferior móvil -------- */
      .lb-mobile-nav {
        display: none;
      }
      @media (max-width: 720px) {
        .lb-shell { grid-template-columns: 1fr !important; }
        .lb-shell > aside { display: none; }
        .lb-mobile-nav {
          display: flex; position: sticky; bottom: 0; z-index: 90;
          background: var(--paper-dark); border-top: 1.5px solid var(--line);
          padding: 8px 18px calc(8px + env(safe-area-inset-bottom));
          align-items: center; justify-content: space-between;
        }
        .lb-mobile-nav-item {
          display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 10px;
          color: var(--ink-soft); background: none; border: none; cursor: pointer;
        }
        .lb-mobile-nav-item.active { background: var(--ink); color: var(--gold); }
        .lb-mobile-fab {
          width: 52px; height: 52px; border-radius: 16px; background: var(--gold); color: var(--ink);
          display: flex; align-items: center; justify-content: center; margin-top: -30px;
          border: 4px solid var(--paper); box-shadow: 0 8px 20px rgba(0,0,0,.25); cursor: pointer;
        }
        .lb-mobile-fab:active { transform: scale(.95); }
        main { padding-bottom: 12px !important; }
      }

      /* -------- Formulario de inventario, responsivo -------- */
      .lb-inv-form-grid {
        display: grid; grid-template-columns: 180px 1fr; gap: 18px; align-items: start;
      }
      .lb-inv-fields-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;
      }
      @media (max-width: 760px) {
        .lb-inv-form-grid { grid-template-columns: 1fr; }
        .lb-inv-fields-grid { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 420px) {
        .lb-inv-fields-grid { grid-template-columns: 1fr; }
        .lb-inv-fields-grid > div[style*="span 2"] { grid-column: span 1 !important; }
      }

      /* -------- Layout general adaptable -------- */
      .lb-shell { transition: grid-template-columns .2s ease; }
      .lb-content-col { min-width: 0; }
      main { min-width: 0; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* Safari le pone su propio estilo a inputs/botones si no se bloquea explícitamente */
      input, select, textarea, button {
        -webkit-appearance: none; appearance: none;
        -webkit-tap-highlight-color: transparent;
      }
      .lb-input, .lb-select, .lb-textarea, .lb-btn { border-radius: 3px; }
      button { -webkit-user-select: none; user-select: none; }
      @supports (height: 100dvh) {
        .lb-root { min-height: 100dvh !important; }
      }
      /* Blindaje contra un bug de Safari/WebKit: elementos con animation dentro de
         layouts flex/grid a veces se encogen al ancho de la palabra más larga
         en vez de ocupar el ancho disponible. Forzamos ancho completo. */
      main, main > div, .lb-fade-in, main p, main h2 {
        width: 100% !important;
        box-sizing: border-box;
      }
      p { max-width: 100%; overflow-wrap: break-word; }
      @media (max-width: 620px) {
        main { padding: 14px 16px 24px !important; }
        .lb-topbar { padding: 8px 12px 0 !important; gap: 6px !important; }
        .lb-topbar .lb-sync-label { display: none; }
        .lb-topbar .lb-icon-btn { width: 30px !important; height: 30px !important; }
        .lb-topbar { flex-wrap: nowrap !important; }
      }
      /* Evita el zoom automático de Safari en iPhone al tocar un campo (letra debe ser >=16px) */
      @media (max-width: 480px) {
        .lb-input, .lb-select, .lb-textarea { font-size: 16px !important; }
      }
      .lb-resp-grid { transition: none; }
      @media (max-width: 700px) {
        .lb-resp-grid { grid-template-columns: 1fr !important; }
      }
      @media (max-width: 900px) {
        .lb-resp-grid-2col { grid-template-columns: 1fr !important; }
      }

      /* -------- Hoja de despacho / impresión -------- */
      .lb-print-sheet {
        background: #fff; color: #1a1a1a; max-width: 1000px; margin: 0 auto;
        padding: 36px; font-family: 'Inter', sans-serif;
      }
      .lb-print-order + .lb-print-order { border-top: 2px dashed #ccc; margin-top: 26px; padding-top: 26px; }
      .lb-print-check { width: 16px; height: 16px; border: 1.5px solid #333; border-radius: 3px; display: inline-block; }
      @page { size: landscape; margin: 10mm; }
      @media print {
        body * { visibility: hidden; }
        .lb-print-sheet, .lb-print-sheet * { visibility: visible; }
        .lb-print-sheet { position: absolute; top: 0; left: 0; width: 100%; max-width: 100%; padding: 10mm; }
        .lb-no-print { display: none !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        .lb-rail-anim, .lb-fade-in, .lb-pop, .lb-glow, .lb-live-dot, .lb-spinicon, .lb-stagger > * { animation: none !important; transition: none !important; }
      }

      /* ======================================================================
         FASE 1 — CAPA DE DISEÑO PREMIUM (landing / catálogo público)
         Todo lo de acá es aditivo: no toca clases existentes, solo las eleva.
         ====================================================================== */

      /* Cursor a medida (solo escritorio, con puntero fino) */
      @media (hover: hover) and (pointer: fine) {
        .lb-root.lb-premium-cursor, .lb-root.lb-premium-cursor * { cursor: none !important; }
      }
      .lb-cursor-dot, .lb-cursor-ring {
        position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
        border-radius: 50%; transform: translate(-50%, -50%);
        will-change: transform, width, height, opacity;
      }
      .lb-cursor-dot {
        width: 5px; height: 5px; background: var(--oxblood); opacity: .55;
        transition: opacity .2s ease, background .2s ease;
      }
      .lb-cursor-ring {
        width: 26px; height: 26px; border: 1px solid var(--oxblood); opacity: .28;
        transition: width .22s cubic-bezier(.2,.8,.2,1), height .22s cubic-bezier(.2,.8,.2,1),
                    border-color .22s ease, background .22s ease, opacity .2s ease;
      }
      /* Sutil casi todo el tiempo — solo se nota de verdad al pasar sobre algo clickeable */
      .lb-cursor-ring.lb-cursor-big {
        width: 60px; height: 60px; background: rgba(130,80,31,.1); border-color: var(--gold);
        opacity: .9; border-width: 1.5px;
      }
      .lb-cursor-hide { opacity: 0 !important; }

      /* Revelado editorial al hacer scroll */
      .lb-reveal {
        opacity: 0; transform: translateY(26px);
        transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);
      }
      .lb-reveal.lb-reveal-in { opacity: 1; transform: translateY(0); }
      .lb-reveal-scale { transform: translateY(18px) scale(.96); }
      .lb-reveal-scale.lb-reveal-in { transform: translateY(0) scale(1); }

      /* Palabras del titular animadas letra por letra */
      .lb-split-word {
        display: inline-block; overflow: hidden; vertical-align: top;
      }
      .lb-split-word > span {
        display: inline-block;
        transform: translateY(115%) scale(.82);
        opacity: 0;
        transition: transform .9s cubic-bezier(.16,1,.3,1), opacity .7s ease;
        transition-delay: var(--lb-split-delay, 0s);
      }
      .lb-split-word.lb-reveal-in > span { transform: translateY(0) scale(1); opacity: 1; }

      /* Frases (subtítulos, kickers) también se revelan palabra por palabra, más rápido y sutil */
      .lb-split-phrase > span {
        display: inline-block;
        transform: translateY(60%);
        opacity: 0;
        transition: transform .6s cubic-bezier(.16,1,.3,1), opacity .5s ease;
        transition-delay: var(--lb-split-delay, 0s);
      }
      .lb-split-phrase.lb-reveal-in > span { transform: translateY(0); opacity: 1; }

      /* Hero editorial: tipografía enorme, aire, textura viva */
      .lb-landing-section:first-of-type {
        position: relative;
        isolation: isolate;
        padding-top: 64px !important;
        padding-bottom: 64px;
      }
      .lb-landing-section:first-of-type::before {
        content: '';
        position: absolute; inset: -40px -20% auto -20%; height: 480px; z-index: -1;
        background:
          radial-gradient(ellipse 620px 320px at 24% 20%, rgba(232,198,126,.32), transparent 65%),
          radial-gradient(ellipse 520px 340px at 78% 70%, rgba(140,59,30,.16), transparent 60%);
        filter: blur(4px);
        animation: lbMeshDrift 16s ease-in-out infinite alternate;
      }
      @keyframes lbMeshDrift {
        0%   { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(18px, -14px) scale(1.06); }
      }
      .lb-landing-kicker {
        position: relative; display: inline-flex; align-items: center; gap: 10px;
        opacity: 0; animation: lbFadeUp .7s ease .05s forwards;
      }
      .lb-landing-kicker::before, .lb-landing-kicker::after {
        content: ''; width: 22px; height: 1px; background: var(--oxblood);
      }
      .lb-landing-title {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: clamp(38px, 7vw, 76px);
        line-height: 1.02;
        letter-spacing: -0.01em;
        margin: 14px 0 14px !important;
      }
      .lb-landing-section:first-of-type .lb-landing-title {
        background: linear-gradient(100deg, var(--ink) 30%, var(--oxblood) 55%, var(--ink) 78%);
        background-size: 220% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: lbTitleSheen 7s ease-in-out 1.1s infinite;
      }
      @keyframes lbTitleSheen {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      .lb-landing-sub {
        opacity: 0; animation: lbFadeUp .8s ease .35s forwards;
        font-size: clamp(14px, 1.6vw, 17px);
      }

      /* Tarjetas destacadas: profundidad, tilt suave, brillo que sigue el cursor */
      .lb-featured-card {
        --lb-tiltx: 0deg; --lb-tilty: 0deg; --lb-glow-x: 50%; --lb-glow-y: 50%;
        transform: perspective(900px) rotateX(var(--lb-tilty)) rotateY(var(--lb-tiltx)) translateY(0);
        transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, border-color .35s ease;
        will-change: transform;
      }
      .lb-featured-card::after {
        content: '';
        position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 2;
        background: radial-gradient(circle 180px at var(--lb-glow-x) var(--lb-glow-y), rgba(232,198,126,.35), transparent 70%);
        transition: opacity .25s ease;
      }
      .lb-featured-card:hover::after { opacity: 1; }
      .lb-featured-card:hover {
        box-shadow: 0 30px 60px -20px rgba(43,38,32,.35), 0 4px 14px rgba(43,38,32,.12);
      }
      .lb-featured-img-wrap img { transition: transform .8s cubic-bezier(.16,1,.3,1), filter .5s ease; }
      .lb-featured-card:hover .lb-featured-img-wrap img { transform: scale(1.09) rotate(.3deg); }

      /* Botones magnéticos con brillo dinámico */
      .lb-btn {
        transition: transform .18s cubic-bezier(.2,.8,.2,1), background .18s ease, color .18s ease, box-shadow .25s ease;
      }
      .lb-btn.lb-magnetic:hover {
        box-shadow: 0 10px 24px -8px rgba(43,38,32,.4);
      }

      /* Vidrio esmerilado más pronunciado para dropdowns / paleta / modal de detalle */
      .lb-dropdown, .lb-palette {
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        background: rgba(243,233,212,.86);
      }
      .lb-root.lb-dark .lb-dropdown, .lb-root.lb-dark .lb-palette {
        background: rgba(36,26,16,.86);
      }

      @media (prefers-reduced-motion: reduce) {
        .lb-reveal, .lb-split-word > span, .lb-landing-kicker, .lb-landing-sub, .lb-featured-card,
        .lb-landing-section:first-of-type::before, .lb-landing-section:first-of-type .lb-landing-title {
          animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important;
        }
      }
      @media (max-width: 620px) {
        .lb-landing-title { font-size: clamp(30px, 10vw, 44px); }
      }

      /* ======================================================================
         FASE 2 — Navbar de filtros, grilla completa y modal de producto
         ====================================================================== */

      /* Barra de búsqueda/filtros pegajosa: vidrio esmerilado al quedar fija */
      .lb-catalog-navbar {
        padding: 10px 10px 6px;
        margin-left: -10px;
        margin-right: -10px;
        border-radius: 10px;
        transition: background .25s ease, box-shadow .25s ease, backdrop-filter .25s ease;
      }
      .lb-catalog-navbar::before {
        content: '';
        position: absolute; inset: 0; z-index: -1; border-radius: 10px;

<script>
  // ============================================================
  // FASE 1 — Capa de interacción premium (aditiva, no toca React)
  // Cursor a medida, botones magnéticos, tilt en tarjetas,
  // revelado al scroll y titulares partidos en palabras.
  // Se re-aplica solo a nodos nuevos vía MutationObserver, así
  // que funciona con las vistas que React monta/desmonta.
  // ============================================================
  (function () {
    "use strict";
    var seenReveal = typeof WeakSet !== "undefined" ? new WeakSet() : null;
    var seenSplit = typeof WeakSet !== "undefined" ? new WeakSet() : null;

    function wasSeen(set, el) { if (!set) return false; try { return set.has(el); } catch (e) { return false; } }

    // ---- Cursor a medida ------------------------------------------------
    // IMPORTANTE: el cursor real del sistema NUNCA se apaga hasta que
    // confirmamos que el cursor personalizado ya se está dibujando de
    // verdad (primer mousemove real procesado). Así, en una PC lenta que
    // no llegue a pintar la animación a tiempo, el usuario sigue viendo
    // la flecha normal en vez de quedarse "sin cursor" y sentir que la
    // página no responde.
    var dot, ring, cursorReady = false, cursorConfirmed = false;
    var rafSupported = typeof requestAnimationFrame === "function";
    function confirmPremiumCursor() {
      if (cursorConfirmed) return;
      cursorConfirmed = true;
      var root = document.querySelector(".lb-root");
      if (root) root.classList.add("lb-premium-cursor");
    }
    function ensureCursor() {
      if (cursorReady || !finePointer || reducedMotion || !rafSupported) return;
      dot = document.createElement("div");
      dot.className = "lb-cursor-dot lb-cursor-hide";
      ring = document.createElement("div");
      ring.className = "lb-cursor-ring lb-cursor-hide";
      document.body.appendChild(dot);
      document.body.appendChild(ring);
      var rx = 0, ry = 0, tx = 0, ty = 0;
      window.addEventListener("mousemove", function (e) {

        // sistema — nunca antes, para no dejar a nadie "a ciegas".

        ring.classList.remove("lb-cursor-hide");

        dot.style.transform = "translate(" + rx + "px," + ry + "px) translate(-50%,-50%)";
        var big = e.target && e.target.closest && e.target.closest(".lb-btn, .lb-featured-card, a, .lb-icon-btn, button, [role='button']");

      // se puede dibujar a tiempo.

              if (root) root.classList.remove("lb-premium-cursor");
              dot.classList.add("lb-cursor-hide");
              ring.classList.add("lb-cursor-hide");

              slowFrames = 0;

    // ---- Luz que sigue el cursor en el modal de producto ---------------
    document.addEventListener("mousemove", function (e) {
      if (!finePointer || reducedMotion) return;
      var dcard = e.target && e.target.closest && e.target.closest(".lb-detail-card");
      if (!dcard) return;

      var px = ((e.clientX - r.left) / r.width) * 100;
      var py = ((e.clientY - r.top) / r.height) * 100;

      dcard.style.setProperty("--lb-dglow-y", py.toFixed(1) + "%");

    }, { passive: true });
    document.addEventListener("mouseout", function (e) {
      var dcard = e.target && e.target.closest && e.target.closest(".lb-detail-card");
      if (dcard && (!e.relatedTarget || !dcard.contains(e.relatedTarget))) {

      el.textContent = "";
      el.classList.add("lb-split-phrase");
      var wordIndex = 0;
      words.forEach(function (word) {
        if (!word.trim()) { el.appendChild(document.createTextNode(word)); return; }
        var inner = document.createElement("span");
        inner.textContent = word;
        inner.style.setProperty("--lb-split-delay", (wordIndex * 0.035) + "s");
        el.appendChild(inner);
        el.appendChild(document.createTextNode(" "));
        wordIndex++;
      });
      if (revealObserver) revealObserver.observe(el);
      else el.classList.add("lb-reveal-in");
    }

    function enhanceNewNodes(root) {
      root = root || document;
      if (root.querySelectorAll) {
        root.querySelectorAll(".lb-landing-section").forEach(function (el) { tagForReveal(el, false); });
        root.querySelectorAll(".lb-featured-card").forEach(function (el) { tagForReveal(el, true); });
        // Todos los titulares de sección se despliegan palabra por palabra, creciendo, no solo el primero.
        root.querySelectorAll(".lb-landing-title").forEach(function (el) { splitTitle(el); });
        // Kickers y subtítulos también se revelan palabra por palabra, más rápido y sutil.
        root.querySelectorAll(".lb-landing-kicker").forEach(function (el) { splitPhrase(el); });
        root.querySelectorAll(".lb-landing-sub").forEach(function (el) { splitPhrase(el); });
      }
      syncCursorScope();
    }

    // ---- Detecta cuándo la barra de filtros del catálogo queda "pegada" ----
    function syncStuckNavbar() {
      var bar = document.querySelector(".lb-catalog-navbar");
      if (!bar) return;
      var r = bar.getBoundingClientRect();
      bar.classList.toggle("lb-nav-stuck", r.top <= 11);
    }
    window.addEventListener("scroll", syncStuckNavbar, { passive: true });
    window.addEventListener("resize", syncStuckNavbar, { passive: true });

    var mo = new MutationObserver(function (mutations) {
      var needsScan = false;
      for (var i = 0; i < mutations.length; i++) {
        if (mutations[i].addedNodes && mutations[i].addedNodes.length) { needsScan = true; break; }
      }
      if (needsScan) enhanceNewNodes(document);
    });

    function boot() {
      var root = document.getElementById("root");
      if (!root) { setTimeout(boot, 200); return; }
      mo.observe(root, { childList: true, subtree: true });
      enhanceNewNodes(document);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
</body>
</html>
